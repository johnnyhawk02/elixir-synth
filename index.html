<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Elixir Synth</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0c0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="description" content="Elixir Synth: a landscape mono synth in the browser, playing the drum 1 voice of a JavaScript port of the Erica Synths LXR-02 engine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>

/* ==== Elixir Synth: the screen ====
   One pane of blue backlit LCD in a black bezel on a dark case, like a character module: the pixels lit near-white on
   the blue, a faint ghost of the unlit ones, a soft glow round the lit ones, and a pixel font throughout. Buttons are outlined
   boxes that invert when pressed or chosen; faders and meters are segmented bar graphs. Sections inside the screen
   are parted by thin ink lines; the sheets that open over it (sequencer, settings, chooser, loop length) are panes of
   their own. Nothing scrolls but the presets list and the pop-ups' lists.
   The screen is landscape, 5:3, laid out once at 1000 x 600 and scaled to fit the window (--k, set by mFit in ui.js),
   with the dark case showing round it; so it reads the same at any size, as a plugin window that resizes does. */

/* ---- the page and the screen ---- */
* { box-sizing: border-box; }
html, body { margin: 0; overscroll-behavior: none; }
[hidden] { display: none !important; }
body { position: relative; height: 100dvh; overflow: hidden; -webkit-tap-highlight-color: transparent; background: radial-gradient(120% 80% at 50% 0%, #2a2d28, #161815) fixed; }
.m {
  --panel: #2238e6; --ink: #eef3ff; --muted: rgba(225, 233, 255, .7);
  --tint: rgba(225, 235, 255, .08); --tint-2: rgba(225, 235, 255, .15); --ghost: rgba(160, 185, 255, .17); --led: #eef3ff;
  --display: "VT323", ui-monospace, monospace; --body: "VT323", ui-monospace, monospace; --mono: "VT323", ui-monospace, monospace;
  --fs-xs: 1.12rem; --fs-s: 1.25rem; --fs-m: 1.3rem; --fs-l: 1.6rem;
  --rule: 1px solid rgba(225, 235, 255, .38);
  position: absolute; left: 50%; top: 50%; width: 1000px; height: 600px; transform: translate(-50%, -50%) scale(var(--k, 1));
  display: grid; grid-template-columns: 400px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr);
  grid-template-areas: "top trans" "side tabs" "side pages"; column-gap: 16px; padding: 8px 12px 10px;
  font-family: var(--body); color: var(--ink);
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; /* a long hold mustn't bring up the phone's own menus */
  border: 5px solid #0b0c0a; border-radius: 10px;
  /* uneven backlighting: lit from LEDs along the lower edge, as a cheap LCD is, so it glows brighter near
     the bottom corners, fades toward the top, and has a dim patch where the light doesn't quite reach; the glass
     texture sits over it (all behind the pixels, so the type stays as bright) */
  background-color: var(--panel);
  background-image: linear-gradient(170deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, 0) 38%, rgba(0, 0, 0, .05)),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .03) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0, 0, 0, .03) 0 1px, transparent 1px 3px),
    radial-gradient(60% 34% at 12% 100%, rgba(185, 215, 255, .6), rgba(185, 215, 255, 0) 70%),
    radial-gradient(52% 30% at 88% 102%, rgba(170, 205, 255, .45), rgba(170, 205, 255, 0) 70%),
    radial-gradient(45% 25% at 50% 104%, rgba(200, 225, 255, .26), rgba(200, 225, 255, 0) 75%),
    radial-gradient(38% 22% at 72% 38%, rgba(6, 12, 90, .16), rgba(6, 12, 90, 0) 70%),
    radial-gradient(30% 18% at 22% 30%, rgba(210, 230, 255, .08), rgba(210, 230, 255, 0) 70%),
    linear-gradient(180deg, rgba(6, 12, 90, .22) 0%, rgba(6, 12, 90, 0) 30%),
    radial-gradient(130% 100% at 50% 60%, rgba(0, 0, 0, 0) 55%, rgba(4, 8, 70, .3) 100%);
  /* depth: it sits deep in its bezel, the inner shadow heaviest at the top right */
  box-shadow: inset 0 6px 16px rgba(0, 0, 0, .36), inset -8px 8px 18px rgba(0, 0, 0, .2), inset 0 0 0 1px rgba(255, 255, 255, .1), 0 1px 0 rgba(255, 255, 255, .07);
}
/* faded patches: an old LCD loses contrast in places, so a few soft patches show their pixels dimmer (a glass-coloured
   veil, clearest at the top right, a smaller one low on the left, a faint band down the right edge; it never takes a
   touch, and the sheets open above it) */
.m::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 5;
  background: radial-gradient(34% 17% at 76% 24%, rgba(34, 56, 230, .42), rgba(34, 56, 230, 0) 100%),
    radial-gradient(22% 12% at 16% 66%, rgba(34, 56, 230, .38), rgba(34, 56, 230, 0) 100%),
    radial-gradient(14% 9% at 58% 83%, rgba(34, 56, 230, .3), rgba(34, 56, 230, 0) 100%),
    linear-gradient(90deg, rgba(34, 56, 230, 0) 88%, rgba(34, 56, 230, .22) 97%, rgba(34, 56, 230, .1)); }
/* the lit pixels' glow, a little stronger toward the top right, where the light gathers
   (--d, set per control by mDepth in ui.js: 1 at the bottom left, about 1.7 at the top right) */
.m, .m button, .m-title, .m .m-flab, .m .m-vf output { --d: 1; text-shadow: 0 0 calc(2.5px * var(--d)) rgba(205, 220, 255, calc(.38 + .1 * var(--d))); }
.m .m-vtrack i, .m .m-seq-steps i::after, .m .m-seq-steps i::before, .m .m-gr i b { filter: drop-shadow(calc(2px * var(--d, 1)) calc(2.2px * var(--d, 1)) 0 rgba(4, 10, 80, .17)); }
.m .m-btn, .m .m-toggle, .m .m-pload, .m .m-tabs button, .m .m-xy, .m .m-seq-len, .m .m-xyrow select { box-shadow: calc(2px * var(--d, 1)) calc(2.2px * var(--d, 1)) 0 rgba(4, 10, 80, .14); }
.m .m-tabs button:not([aria-selected="true"]) { box-shadow: none; }

/* cards: the sheets are glass of their own; the sections inside the screen are bare */
.m-card { padding: 16px; border: 4px solid #0b0c0a; border-radius: 8px; background-color: var(--panel);
  background-image: linear-gradient(170deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0) 40%, rgba(0, 0, 0, .06)),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .03) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0, 0, 0, .03) 0 1px, transparent 1px 3px);
  box-shadow: inset 0 3px 10px rgba(0, 0, 0, .28), inset 0 0 0 1px rgba(255, 255, 255, .1), 0 1px 0 rgba(255, 255, 255, .07); }
.m > .m-card, .m-pages .m-card, .m-side .m-card { background: none; border: 0; border-radius: 0; box-shadow: none; }

/* ---- controls ---- */
.m button { font: inherit; color: var(--ink); border: 0; cursor: pointer; touch-action: manipulation; }
/* buttons: an outlined box, inverted when pressed or chosen */
.m-btn { min-height: 56px; font-size: var(--fs-m) !important; }
.m-big { font-size: 1.1rem !important; }
.m-toggle { min-width: 64px; min-height: 36px; font-size: var(--fs-s) !important; }
.m .m-btn, .m .m-rec, .m .m-toggle, .m .m-pload, .m-tabs button {
  background: transparent !important; border: 2px solid var(--ink); border-radius: 3px; font-weight: 400; text-transform: uppercase; letter-spacing: .06em; }
.m .m-btn:active, .m .m-big, .m .m-play, .m-tabs button[aria-selected="true"], .m .m-toggle[aria-pressed="true"], .m .m-plist li.cur .m-pload, .m .m-rec.on {
  background: var(--ink) !important; color: var(--panel) !important; text-shadow: none; }
.m .m-big:active, .m .m-play:active { transform: none; background: transparent !important; color: var(--ink) !important; }
.m .m-btn:disabled { opacity: .3; }

/* a checkbox drawn as an LCD box: a ticked one is filled */
.m-chk { position: relative; display: flex; align-items: center; gap: 10px; min-height: 40px; text-transform: uppercase; font-size: var(--fs-xs); cursor: pointer; }
.m-chk input { position: absolute; left: 0; top: 0; opacity: 0; width: 1px; height: 1px; margin: 0; }
.m-chk i { flex: none; width: 24px; height: 24px; border: 2px solid var(--ink); border-radius: 2px; box-shadow: inset 0 0 0 3px var(--panel); }
.m-chk input:checked + i { background: var(--ink); }
.m-chk input:focus-visible + i { outline: 2px dashed var(--ink); outline-offset: 2px; }

/* a heading with its controls */
.m-chead { display: flex; align-items: center; justify-content: space-between; }
.m-chead b { font-size: var(--fs-m); }
.m .m-chead b { font-weight: 400; text-transform: uppercase; letter-spacing: .08em; }

/* a meter (the sidechain's duck, the compressor's reduction), segmented */
.m-gr { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: var(--fs-s); }
.m .m-gr i { height: 14px; border-radius: 0; overflow: hidden; display: flex; justify-content: flex-end;
  background: repeating-linear-gradient(to left, var(--ghost) 0 5px, transparent 5px 8px); }
.m .m-gr i b { height: 100%; width: 0; border-radius: 0; background: repeating-linear-gradient(to left, var(--ink) 0 5px, transparent 5px 8px); background-position: right; }
.m-gr output { font-family: var(--mono); font-size: var(--fs-xs); color: var(--muted); min-width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; }

/* faders: a column of segments, the unlit ones a faint ghost, the value the top lit segment; readout above, label under */
.m-faders { display: grid; gap: 14px; }
.m-vf { display: grid; grid-template-rows: 2.6em auto auto; justify-items: center; gap: 6px; min-width: 0; }
.m-vf output { font-family: var(--mono); text-align: center; white-space: pre-line; align-self: end; overflow: hidden; max-width: 100%; font-variant-numeric: tabular-nums; }
.m .m-vf output { font-size: var(--fs-xs); line-height: 1; color: var(--ink); }
.m .m-flab { font-size: var(--fs-xs); font-weight: 400; text-transform: uppercase; letter-spacing: .03em; }
.m .m-vtrack { --f: 0; position: relative; width: 56px; height: 150px; border-radius: 2px; touch-action: none; cursor: ns-resize; overflow: hidden;
  background: repeating-linear-gradient(to top, var(--ghost) 0 5px, transparent 5px 8px); background-position: bottom; }
.m .m-vtrack i { position: absolute; left: 0; right: 0; bottom: 0; height: round(down, calc(var(--f) * 100%), 8px);
  background: repeating-linear-gradient(to top, var(--ink) 0 5px, transparent 5px 8px); background-position: bottom; }
.m .m-vtrack b { position: absolute; display: none; }
.m .m-vf.held .m-vtrack { outline: 2px solid var(--ink); outline-offset: 3px; }
/* a fader with a sequencer moving it: its label inverted, its own setting a bar across the track */
.m .m-vf.seq .m-flab { background: var(--ink); color: var(--panel); padding: 0 4px; text-shadow: none; }
.m .m-vtrack.mod { overflow: visible; }
.m .m-vtrack.mod b { display: block; left: -3px; right: -3px; height: 4px; border-radius: 0; bottom: calc(var(--b) * (100% - 4px)); background: var(--ink); box-shadow: 0 0 0 2px var(--panel); }

/* the big faders (perf): a two-line readout, tracks as tall as the page */
#m-perf .m-vf { display: flex; flex-direction: column; align-items: center; min-height: 0; gap: 3px; }
#m-perf .m-vf output { font-size: min(var(--fs-xs), 16px); line-height: 1; color: var(--ink); height: 2.5em; display: flex; align-items: flex-end; justify-content: center; flex: none; align-self: stretch; }
.m #m-perf .m-flab { font-size: min(var(--fs-xs), 16px); letter-spacing: -.02em; white-space: nowrap; line-height: 1.2; }
#m-perf .m-vtrack { width: min(56px, 100%); flex: 1; height: auto; min-height: 48px; }

/* the dials (perf): a ring of segments over three quarters of a turn, lit up to the value, the CC number in the middle;
   as big as the cell lets them be, the readout over and the label under */
.m .m-dial { container-type: size; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 0; }
.m #m-perf .m-dial output { height: auto; font-size: min(var(--fs-xs), 15.2px); white-space: nowrap; align-items: center; }
.m #m-perf .m-dial .m-flab { font-size: min(var(--fs-xs), 15.2px); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.m #m-perf .m-dial .m-vtrack { --s: min(100cqw - 6px, 100cqh - 44px, 96px); flex: none; width: var(--s); height: var(--s); min-height: 0; border-radius: 50%;
  overflow: visible; cursor: ns-resize; background: none; }
.m .m-dial .m-vtrack::before, .m .m-dial .m-vtrack i { content: ''; position: absolute; inset: 0; height: auto; border-radius: 50%;
  -webkit-mask: radial-gradient(closest-side, transparent 64%, #000 65%, #000 99%, transparent 100%), repeating-conic-gradient(from 225deg, #000 0 7deg, transparent 7deg 10deg);
  -webkit-mask-composite: source-in; mask: radial-gradient(closest-side, transparent 64%, #000 65%, #000 99%, transparent 100%) intersect, repeating-conic-gradient(from 225deg, #000 0 7deg, transparent 7deg 10deg); }
.m .m-dial .m-vtrack::before { background: conic-gradient(from 225deg, var(--ghost) 0 270deg, transparent 270deg); }
.m .m-dial .m-vtrack i { background: conic-gradient(from 225deg, var(--ink) 0 calc(var(--f) * 270deg), transparent calc(var(--f) * 270deg)); transition: none; }
.m .m-dial .m-vtrack em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-family: var(--mono);
  font-size: min(var(--fs-xs), 14px); color: var(--muted); }
/* a dial's own setting under its sequencer: a needle at that angle */
.m .m-dial .m-vtrack.mod b { display: block; left: calc(50% - 2px); right: auto; top: 0; bottom: auto; width: 4px; height: 50%; box-shadow: none;
  -webkit-mask: linear-gradient(#000 0 30%, transparent 30%); mask: linear-gradient(#000 0 30%, transparent 30%);
  transform-origin: 50% 100%; transform: rotate(calc(-135deg + var(--b) * 270deg)); }
.m .m-dial.held .m-vtrack { outline: 2px solid var(--ink); outline-offset: 3px; }

/* the small faders (seq, voice, fx, master): a one-line readout, a narrow label */
.m-row .m-vf, .m-vset .m-vf, .m-seqf .m-vf { display: flex; flex-direction: column; align-items: center; min-height: 0; gap: 2px; }
.m .m-row .m-vf output, .m .m-vset .m-vf output, .m .m-seqf .m-vf output {
  font-size: min(var(--fs-xs), 16.1px); line-height: 1; height: 1.1em; flex: none; align-self: stretch; text-align: center; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.m .m-row .m-flab, .m .m-vset .m-flab, .m .m-seqf .m-flab { font-size: min(1.05rem, 15.2px); letter-spacing: 0; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.m .m-row .m-vtrack, .m .m-vset .m-vtrack, .m .m-seqf .m-vtrack { width: min(52px, 100%); flex: 1; height: auto; min-height: 12px; }

/* ---- the frame: title line, transport, pages, page buttons ---- */
.m-top { grid-area: top; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px; border-bottom: var(--rule); }
.m-title { font-family: var(--display); font-size: 1.5rem; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.m-ver { margin-left: .5em; font-size: .7em; letter-spacing: .06em; text-transform: none; opacity: .7; }
/* (the page buttons show which page is open, so its name isn't needed on the title line) */
.m-pagename { display: none; white-space: nowrap; font-family: var(--display); font-size: 1.5rem; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }

/* play, rec, and the step light */
.m-trans { grid-area: trans; padding: 8px 0; display: grid; grid-template-columns: 130px 110px minmax(0, 1fr); gap: 8px; align-items: stretch; }
.m > .m-card.m-trans { border-bottom: var(--rule); }
.m-play { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; background: var(--ink) !important;
  color: var(--panel) !important; font-weight: 400; text-transform: uppercase; }
.m .m-play { border: 2px solid var(--ink); border-radius: 3px; letter-spacing: .1em; font-size: var(--fs-m) !important; }
.m-play svg { width: 20px; height: 20px; fill: currentColor; }
.m-play .i-stop, .m-play[aria-pressed="true"] .i-play { display: none; }
.m-play[aria-pressed="true"] .i-stop { display: inline; }
.m .m-rec { display: grid; grid-auto-flow: column; justify-content: center; place-items: center; align-content: center; gap: min(10px, 8.2px) !important; min-height: 46px; }
.m-rec i { width: 16px; height: 16px; border-radius: 2px; background: var(--ink); }
.m-rec span { font-family: var(--mono); font-size: var(--fs-s); font-variant-numeric: tabular-nums; }
.m-rec.on i { width: 16px; height: 16px; border-radius: 4px; background: var(--panel); animation: m-blink 1s steps(1) infinite; }
@keyframes m-blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .m-rec.on i { animation: none; } }
.m .m-rec:disabled { opacity: .35; }
/* the step light: sixteen segments in a row, the step playing lit */
.m-steps-led { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; padding: 10px 0 10px 8px; }
.m-steps-led i { background: var(--ghost); border-radius: 1px; }
.m-steps-led i:nth-child(4n+1) { box-shadow: inset 0 -3px 0 var(--tint-2); }
.m-steps-led i.on { background: var(--ink); }

/* the pages sit side by side on the right; swipe across them or tap a page button. Each page is one screen, no scrolling */
.m-pages { grid-area: pages; display: grid; grid-auto-flow: column; grid-auto-columns: 100%; column-gap: 16px; min-height: 0; padding-top: 6px; overflow: hidden;
  overscroll-behavior-x: contain; scrollbar-width: none; touch-action: none; }
.m-pages::-webkit-scrollbar { display: none; }
.m-panel { display: grid; grid-template-rows: 1fr; gap: 12px; align-content: stretch; min-height: 0; overflow: hidden; }

/* the page buttons, one line of six over the pages */
.m > .m-tabs { grid-area: tabs; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; padding: 8px 0 6px; border-bottom: var(--rule); }
.m-tabs button { border-color: transparent; min-width: 0; }
.m-tabs button[aria-selected="true"] { border-color: var(--ink); }
.m .m-tabs button { min-height: 40px; padding: 0; font-size: 1.3rem !important; letter-spacing: .04em; }

/* ---- perf, always on show down the left: twelve dials, four across, and the randomise column beside them ---- */
.m-side { grid-area: side; display: grid; grid-template-columns: minmax(0, 1fr) 104px; gap: 8px; min-height: 0; overflow: hidden; padding-top: 6px; }
.m-play-card { display: grid; min-height: 0; padding: 6px 2px; }
#m-perf { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 4px 2px; min-height: 0; }
.m-side .m-rand-card { display: grid; min-height: 0; padding: 6px 2px 6px 8px; border-left: var(--rule); }
.m-rand { display: grid; grid-template-columns: 1fr; grid-template-rows: auto repeat(7, minmax(0, 1fr)); gap: 6px; min-width: 0; height: 100%; }
.m-rand .m-btn { min-height: 0; min-width: 0; padding: 0 2px; letter-spacing: .02em; overflow: hidden; }
.m .m-rand .m-btn { font-size: min(var(--fs-xs), 15.2px) !important; white-space: nowrap; }
.m-nextbar { gap: 6px; font-size: min(var(--fs-xs), 14.8px); white-space: nowrap; justify-content: flex-start; padding-left: 4px; min-height: 36px; }
.m-nextbar i { width: 18px; height: 18px; }
/* next bar: a button waiting for the bar flashes */
.m .m-btn.pending { animation: m-flash .5s steps(1) infinite; }
@media (prefers-reduced-motion: reduce) { .m .m-btn.pending { animation: none; outline: 2px dashed var(--ink); outline-offset: 2px; } }

/* ---- seq: what a touch sets, the sixteen steps in two rows, then root, scale, accent, glide and the buttons ---- */
.m-seqpage { display: grid; grid-template-rows: auto auto minmax(0, 1fr) minmax(120px, 34%); gap: 8px; min-height: 0; padding: 6px 2px; }
.m-modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.m .m-modes .m-btn { min-height: 44px; padding: 0 2px; font-size: min(var(--fs-xs), 16px) !important; letter-spacing: .02em; }
.m .m-modes .m-btn[aria-selected="true"] { background: var(--ink) !important; color: var(--panel) !important; text-shadow: none; }
/* the pages: four tabs (the one playing underlined) and the copy button */
.m-npages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 2.4fr); gap: 4px; }
.m .m-npages .m-btn { min-height: 40px; padding: 0 2px; font-size: min(var(--fs-xs), 16px) !important; letter-spacing: .02em; white-space: nowrap; overflow: hidden; }
.m .m-npages .m-btn[aria-selected="true"] { background: var(--ink) !important; color: var(--panel) !important; text-shadow: none; }
.m .m-npages .m-btn.now { box-shadow: inset 0 -5px 0 var(--ink); }
.m .m-npages .m-btn.now[aria-selected="true"] { box-shadow: inset 0 -5px 0 var(--panel); }
.m-steps { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px 4px; min-height: 0; touch-action: none; }
/* a step: its note on top, a bar for its note (or gate) filling from the bottom, A and S lit when accented or sliding */
.m-step { --f: 0; position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 2px; min-height: 0; padding: 3px 2px; border: 2px solid var(--ink); border-radius: 2px; }
.m-step:nth-child(4n+1) { box-shadow: inset 3px 0 0 var(--tint-2); }
.m-sn { font-size: min(var(--fs-xs), 15.6px); line-height: 1; text-align: center; white-space: nowrap; overflow: hidden; }
.m-sbar { display: block; min-height: 0; background: repeating-linear-gradient(to top, var(--ghost) 0 4px, transparent 4px 6px); position: relative; }
.m-sbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: round(down, calc(var(--f) * 100%), 6px);

.m .m-seqbtns .m-btn, .m .m-fxbtns .m-btn { flex-direction: column; min-height: 0; font-size: min(var(--fs-xs), 15.6px) !important; padding: 0 2px; }

/* ---- voice: the section tabs (tone, shape, filter, mod), then that section's faders four by three ---- */

/* ---- x/y: the two picks, then the pad: a dot grid with a square cursor ---- */
.m-xy-card { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; min-height: 0; padding: 10px 2px; }
.m-xyrow { display: grid; grid-template-columns: 2.6em 1fr; gap: 8px; align-items: center; text-transform: uppercase; font-size: var(--fs-s); }

  background: transparent; border: 2px solid var(--ink); border-radius: 3px; padding: 0 8px; }

  background: radial-gradient(circle, var(--ghost) 1.2px, transparent 1.6px) 0 0 / 12px 12px; }
.m .m-xy i { position: absolute; left: calc(16px + (100% - 32px) * var(--x, 0)); bottom: calc(16px + (100% - 32px) * var(--y, 0)); width: 24px; height: 24px; margin: 0 0 -12px -12px;
  border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--ink); pointer-events: none; }

.m-xy-y { left: 8px; bottom: 7px; }

/* ---- fx: the echo row and the ring mod row, each its name over its faders, then random, alter, undo ---- */
.m-fx-card { display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; min-height: 0; padding: 8px 2px; }
.m-fxbtns { grid-template-rows: none; grid-template-columns: 1.3fr 1fr 1fr; }

.m-fxhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }

.m-fxhead .m-chk { min-height: 36px; gap: 8px; }
.m-fxhead .m-chk i { width: 22px; height: 22px; }
/* five to a row everywhere small faders sit in rows, so the columns line up */
.m-row { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: 4px; min-height: 0; }
#m-echo, #m-comp, #m-verb { grid-template-columns: repeat(5, minmax(0, 1fr)); }
#m-ring { grid-template-columns: repeat(5, minmax(0, 1fr)); }

/* ---- mstr: the distortion, then the compressor, each a heading and a row ---- */
.m-comp-card { display: grid; grid-template-rows: auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; min-height: 0; padding: 8px 6px 8px 4px; }
.m-comp-card .m-chead { gap: 10px; min-height: 44px; }

.m-comp-card .m-gr { flex: 1; grid-template-columns: 1fr auto; gap: 8px; }
.m-comp-card .m-toggle { min-width: 56px; min-height: 40px; }
#m-comp.off { opacity: .4; }

/* ---- prst: save at the top, the list between (it scrolls), the file buttons and credits at the foot ---- */
.m-presets-card { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto auto; gap: 6px; min-height: 0; padding: 8px 2px; }
/* save new, and save over the loaded preset */
.m-psaves { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
.m-psaves .m-btn { min-height: 56px; font-size: var(--fs-xs) !important; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* a passing note under them, taking no room while empty */
.m-note { margin: 0; min-height: 1.2em; font-size: var(--fs-s); color: var(--muted); }
.m-presets-card .m-note:empty { min-height: 0; height: 0; margin-top: -6px; }
.m-plist { list-style: none; margin: 4px 0 0; padding: 4px 0 0; display: grid; gap: 4px; align-content: start; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain; border-top: var(--rule); touch-action: pan-y; }
.m-plist li { display: flex; align-items: center; gap: 6px; }
.m-pgroup { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 4px 2px; }
.m-pload { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; min-height: 46px; padding: 0 14px; }
.m-pload b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-pload small { font-family: var(--mono); font-size: var(--fs-xs); color: var(--muted); flex: none; }
.m-plist li.cur .m-pload small { color: inherit; opacity: .7; }
/* a preset waiting for the next bar: its row flashes on and off */
.m .m-plist li.pending .m-pload { animation: m-flash .5s steps(1) infinite; }
@keyframes m-flash { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .m .m-plist li.pending .m-pload { animation: none; outline: 2px dashed var(--ink); outline-offset: 2px; } }
.m-pdel { border-radius: 10px; background: none; color: var(--muted) !important; }
.m .m-pdel { min-height: 46px; min-width: 40px; padding: 0; text-align: center; font-size: 1.2rem !important; text-transform: uppercase; }
.m-pio { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 10px; }

.m-install { margin-top: 10px; }
.m-install[hidden] { display: none; }
.m-foot { color: var(--muted); text-align: center; padding: 0; font-size: .95rem; line-height: 1.2; }
.m-foot a { color: inherit; }

/* ---- the fader step sequencer: a sheet over the pages, leaving perf, play and record beside it free; sixteen
   step bars in two rows (the ones past the length faint), length, slew, speed and depth as horizontal segmented bars,
   then randomise and done ---- */
.m-seq { position: absolute; left: 424px; right: 8px; top: 60px; bottom: 8px; z-index: 10; pointer-events: none; display: flex; align-items: stretch; justify-content: center; }
.m-seq[hidden] { display: none; }
.m-seq-card { width: 100%; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto auto auto; gap: 12px;
  pointer-events: auto; box-shadow: 0 -8px 30px rgba(0, 0, 0, .5), inset 0 3px 10px rgba(0, 0, 0, .28); }
.m-seq .m-chead { gap: 10px; }
.m-seq .m-chead output { flex: 1; text-align: right; color: var(--muted); font-size: var(--fs-s); }
.m-seq-steps { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; height: auto; min-height: 60px; touch-action: none; }
.m-seq-steps i { --up: 0; --dn: 0; position: relative; border-radius: 2px;

.m-seq-steps i::before { top: 50%; height: calc(var(--dn) * 50%); background: repeating-linear-gradient(to bottom, var(--ink) 0 5px, transparent 5px 8px); }
.m-seq-steps i.off { opacity: .25; }
.m-seq-steps i.now { outline: 2px solid var(--ink); outline-offset: 2px; }
/* a horizontal bar (also the randomisers' settings) */
.m-seq-lenrow { display: grid; grid-template-columns: 4.5em 1fr 5.5em; gap: 12px; align-items: center; text-transform: uppercase; }
.m-seq-lenrow output { min-width: 5.5em; text-align: right; }
.m-seq-len { --f: 1; position: relative; height: 36px; touch-action: none; border: 2px solid var(--ink); border-radius: 2px;
  background: repeating-linear-gradient(to right, var(--ghost) 0 5px, transparent 5px 8px) 4px 4px / calc(100% - 8px) calc(100% - 8px) no-repeat; }
.m-seq-len i { position: absolute; left: 4px; top: 4px; bottom: 4px; width: calc((100% - 8px) * var(--w, 1));
  background: repeating-linear-gradient(to right, var(--ink) 0 5px, transparent 5px 8px); }
.m-seq-btns { display: grid; grid-template-columns: 1.3fr 1fr 0.9fr; gap: 8px; }
.m .m-seq-type { font-size: min(var(--fs-xs), 15.7px) !important; padding: 0 2px; letter-spacing: 0; }
.m-seq-btns .m-btn { min-height: 52px; }

/* ---- LCD fade: liquid crystal is slow, so segments come on quickly and linger a moment going off. The faders' and
   meters' lit segments, the step bars and the inverted buttons and tabs ease rather than jump (off slower than on);
   type changes as it does on a real LCD, at once ---- */

.m .m-btn, .m .m-toggle, .m .m-pload, .m .m-tabs button, .m .m-trans button { transition: background-color .22s ease-out, color .22s ease-out, opacity .22s ease-out; }

.m .m-seq-steps i.now, .m .m-xy i { transition: outline-color .2s ease-out, left .07s linear, bottom .07s linear; }
/* a fader moved by MIDI follows the knob straight away */
.m .m-vf.cc .m-vtrack i { transition: none; }
@media (prefers-reduced-motion: reduce) { .m .m-vtrack i, .m .m-gr i b, .m .m-seq-steps i::after, .m .m-seq-steps i::before, .m .m-btn, .m .m-toggle, .m .m-pload, .m .m-tabs button, .m .m-trans button, .m .m-xy i { transition: none; } }

  if (x === 0) { ibuf[0] = up ? 1 : -2147483647; return fbuf[0]; }
  ibuf[0] += (x > 0) === up ? 1 : -1;
  return fbuf[0];
}

  a = f(a); b = f(b); c = f(c);

  const s = p + c;
  const bb = s - p;
  const e = (p - (s - bb)) + (c - bb);
  const r = f(s);
  if (e === 0 || r === s || !isFinite(s)) return r;
  const other = nextFloat(r, s > r);
  if ((r + other) / 2 !== s) return r;
  // s sits exactly between r and other: the exact result is on the side e points to
  return (e > 0) === (other > r) ? other : r;

// Hardware RNG stand-in (HAL_RNG_GetRandomNumber). The LXR uses the STM32's true RNG; this
// is a xorshift32 shared by every voice, called in the same order as the firmware does.
class Rng {
  constructor(seed = 0x12345678) { this.state = seed >>> 0; }
  next() {
    let x = this.state;
    x ^= x << 13; x >>>= 0;
    x ^= x >>> 17;
    x ^= x << 5; x >>>= 0;
    this.state = x;
    return x;
  }
}

// ---------------------------------------------------------------------------------------
// Oscillator.c
// ---------------------------------------------------------------------------------------
const SINE = 0, TRI = 1, SAW = 2, REC = 3, NOISE = 4, PWM = 5, NUM_OSC_WAVEFORMS = 6;
const OSC_WAVE_NAMES = ['Sine', 'Tri', 'Saw', 'Rec', 'Noise', 'PWM'];
const SEQ_DEFAULT_NOTE = 60;

// the three band-limited wavetables, back to back like in flash (a read one past the end of
// row 10 of one table lands in the next table)
const WAVE_MEM = new Int16Array(TRI_TABLE.length * 3 + 1);
WAVE_MEM.set(TRI_TABLE, 0);
WAVE_MEM.set(REC_TABLE, TRI_TABLE.length);

const TRI_BASE = 0, REC_BASE = TRI_TABLE.length, SAW_BASE = TRI_TABLE.length * 2;

// pitches above ~14 kHz); whatever the linker put next is read. By default this port wraps to
// the start of that row, which continues the waveform; verify.mjs sets it to what follows the
// table in the reference binary.
WAVE_MEM[WAVE_MEM.length - 1] = SAW_TABLE[10 * 1024];

function makeOsc() {
  return {
    output: 0, pm: null, phaseInc: 0, phase: 0, freq: 0, waveform: 0, tableOffset: 0,
    pitchMod: 0, fmMod: 0, modNodeValue: 0, midiFreq: 0, baseNote: 0,
    detune: 1, // not in the firmware (elixir-synth): a pitch factor for a note between semitones; 1 = the firmware's path
  };
}

const freq2PhaseIncr = (x) => toU32(f(f(f(4096 * x) / REAL_FS) * 1048576));
const freq2PhaseIncr1024 = (x) => toU32(f(f(f(1024 * x) / REAL_FS) * 4194304));

// fast_log2() returns uint8 31-clz, so log2(0) is 255; freqToTableIndex() keeps the uint8 wrap
function freqToTableIndex(fr) {
  const log2 = (31 - Math.clz32(toU32(f(fr / 440)))) & 0xff;
  const midiNote = 12 * log2 + 70;
  return Math.trunc(midiNote / 12) & 0xff;
}

// interpolated table read: table[itg] + ((table[itg+1]-table[itg]) * frac) >> shift
function lerp(mem, idx, frac, shift) {
  const a = mem[idx];
  const d = mem[idx + 1] - a;
  return (a + Math.floor(d * frac / 2 ** shift)) << 16 >> 16;
}

function calcSineBlock(osc, buf, size, gain) {
  const pm = osc.pm;
  for (let i = 0; i < size; i++) {
    const phase = osc.phase, p = pm ? (phase + pm[i]) >>> 0 : phase;
    const out = lerp(SINE_TABLE, p >>> 20, p & 0xfffff, 20);
    osc.phase = (phase + osc.phaseInc) >>> 0;
    buf[i] = toI16(f(out * gain));
  }
}

function calcFmSineBlock(osc, mod, buf, size, gain) {
  const pm = osc.pm;
  for (let i = 0; i < size; i++) {
    const phase = osc.phase;
    const index = ((pm ? phase + pm[i] : phase) + ((toU32(f(mod[i] * osc.fmMod)) << 17) >>> 0)) >>> 0;
    const out = lerp(SINE_TABLE, index >>> 20, index & 0xfffff, 20);
    osc.phase = (phase + osc.phaseInc) >>> 0;
    buf[i] = toI16(f(out * gain));
  }
}

function calcFmBlock(osc, base, mod, buf, size, gain) {
  const row = base + osc.tableOffset * 1024, pm = osc.pm;
  for (let i = 0; i < size; i++) {
    const phase = osc.phase;
    const index = ((pm ? phase + pm[i] : phase) + ((toU32(f(mod[i] * osc.fmMod)) << 19) >>> 0)) >>> 0;
    const out = lerp(WAVE_MEM, row + (index >>> 22), index & 0x3fffff, 22);
    osc.phase = (phase + osc.phaseInc) >>> 0;
    osc.output = out;
    buf[i] = toI16(f(out * gain));
  }
}

// second saw shifted by pwm * half a cycle; the shift is added in float, like in C
const pwmShift = (phase, pwm) => toU32(f(f(phase) + f(pwm * 2147483648)));

function calcPwmFmBlock(osc, mod, buf, size, gain, pwm) {
  const row = SAW_BASE + osc.tableOffset * 1024, pm = osc.pm;
  for (let i = 0; i < size; i++) {
    const phase = osc.phase;
    const index = ((pm ? phase + pm[i] : phase) + ((toU32(f(mod[i] * osc.fmMod)) << 19) >>> 0)) >>> 0;
    const index2 = pwmShift(index, pwm);
    const a = lerp(WAVE_MEM, row + (index >>> 22), index & 0x3fffff, 22);
    const b = lerp(WAVE_MEM, row + (index2 >>> 22), index2 & 0x3fffff, 22);
    const out = qsub16(a, b);
    osc.phase = (phase + osc.phaseInc) >>> 0;
    osc.output = out;
    buf[i] = toI16(f(out * gain));
  }
}

function calcWavetableOscBlock(osc, base, buf, size, gain) {
  const row = base + osc.tableOffset * 1024, pm = osc.pm;
  for (let i = 0; i < size; i++) {
    const phase = osc.phase, p = pm ? (phase + pm[i]) >>> 0 : phase;
    const out = lerp(WAVE_MEM, row + (p >>> 22), p & 0x3fffff, 22);
    osc.phase = (phase + osc.phaseInc) >>> 0;
    buf[i] = toI16(f(out * gain));
  }
}

function calcPwmBlock(osc, buf, size, gain, pwm) {
  const row = SAW_BASE + osc.tableOffset * 1024, pm = osc.pm;
  for (let i = 0; i < size; i++) {
    const phase = osc.phase, p = pm ? (phase + pm[i]) >>> 0 : phase;
    const phase2 = pwmShift(p, pwm);
    const a = lerp(WAVE_MEM, row + (p >>> 22), p & 0x3fffff, 22);
    const b = lerp(WAVE_MEM, row + (phase2 >>> 22), phase2 & 0x3fffff, 22);
    const out = qsub16(a, b);
    osc.phase = (phase + osc.phaseInc) >>> 0;
    osc.output = out;
    buf[i] = toI16(f(out * gain));
  }

// sample-and-hold noise: a new random value each time the phase wraps
function calcNoiseBlock(osc, buf, size, gain, rng) {
  for (let i = 0; i < size; i++) {
    const last = osc.phase;
    osc.phase = (osc.phase + osc.phaseInc) >>> 0;
    if (last > osc.phase) osc.output = (rng.next() << 16) >> 16;
    buf[i] = toI16(f(osc.output * gain));
  }
}

// waveforms above PWM are user samples, which this port doesn't load; like the firmware
// without samples, they leave the buffer as it was
function calcNextOscSampleBlock(osc, buf, size, gain, pwm, rng) {
  switch (osc.waveform) {
    case SINE: calcSineBlock(osc, buf, size, gain); break;
    case SAW: calcWavetableOscBlock(osc, SAW_BASE, buf, size, gain); break;
    case TRI: calcWavetableOscBlock(osc, TRI_BASE, buf, size, gain); break;
    case REC: calcWavetableOscBlock(osc, REC_BASE, buf, size, gain); break;
    case NOISE: calcNoiseBlock(osc, buf, size, gain, rng); break;
    case PWM: calcPwmBlock(osc, buf, size, gain, pwm); break;
    default: break;
  }
}

function calcNextOscSampleFmBlock(osc, mod, buf, size, gain, pwm, rng) {
  switch (osc.waveform) {
    case SINE: calcFmSineBlock(osc, mod, buf, size, gain); break;
    case SAW: calcFmBlock(osc, SAW_BASE, mod, buf, size, gain); break;
    case TRI: calcFmBlock(osc, TRI_BASE, mod, buf, size, gain); break;
    case REC: calcFmBlock(osc, REC_BASE, mod, buf, size, gain); break;
    case NOISE: calcNoiseBlock(osc, buf, size, gain, rng); break;
    case PWM: calcPwmFmBlock(osc, mod, buf, size, gain, pwm); break;
    default: break;
  }
}

function osc_setFreq(osc) {
  const cur = f(f(osc.freq * osc.pitchMod) * osc.modNodeValue);
  switch (osc.waveform) {
    case SINE:
    case NOISE:
      osc.phaseInc = freq2PhaseIncr(cur);
      break;
    case SAW: case TRI: case REC: case PWM: {
      osc.phaseInc = freq2PhaseIncr1024(cur);
      const idx = freqToTableIndex(cur);
      osc.tableOffset = idx > 10 ? 10 : idx;
      break;
    }
    default:
      osc.phaseInc = freq2PhaseIncr32767(cur);
      break;
  }
}

/** midiParser_calcDetune: fine tune value 0..127 -> +/- one semitone factor */
function calcDetune(value) {
  const frac = f(f(value / 127) - 0.5);
  return f(1 + f(frac * SEMITONE_UP_MINUS_1));
}

function osc_recalcFreq(osc) {
  const cent = calcDetune(osc.midiFreq & 0xff);
  let note = (osc.midiFreq >> 8) + (osc.baseNote - SEQ_DEFAULT_NOTE);
  if (note > 127) note = 127;
  if (note < 0) note = 0;
  osc.freq = f(MIDI_NOTE_FREQ[note] * cent);
  if (osc.detune !== 1) osc.freq = f(osc.freq * osc.detune);

function osc_setBaseNote(osc, baseNote) {
  osc.baseNote = baseNote & 0xff;

const setCoarse = (osc, v) => { osc.midiFreq = (osc.midiFreq & 0x00ff) | ((v << 8) & 0xffff); osc_recalcFreq(osc); };
const setFine = (osc, v) => { osc.midiFreq = (osc.midiFreq & 0xff00) | v; osc_recalcFreq(osc); };

// ---------------------------------------------------------------------------------------
// Envelopes: Decay.c (pitch EG, float), SlopeEg2.c (amp EG, double), snapEg.c
// ---------------------------------------------------------------------------------------
const decaySlope = (val, slope) => f(f(f(1 + slope) * val) / f(1 + f(slope * Math.abs(val))));

function decayEg_calcTime(data2) {
  const val = f(data2 / 127);

  return ret > 1 ? 1 : ret;

}
function decayEg_calc(eg) {
  let val = eg.value;
  if (val > 0) val = f(val - eg.decay);

const EG_STOPPED = 0, EG_A = 1, EG_D = 2, EG_REPEAT = 3;
const TIME_K_ATTACK = 2 * 0.99 / (1.0 - 0.99);

const slopeValue = (val, slope) => (1.0 + slope) * val / (1.0 + slope * Math.abs(val));

function makeSlopeEg() {
  return { attack: 0, decay: 0, slope: 0, invSlope: 0, repeat: 0, repeatCnt: 0, value: 0, state: 0 };
}

  const val = data2 / 127.0;

  return ret > 1 ? 1 : ret;

      if (val > 0) val -= eg.attack;

        eg.repeatCnt = (eg.repeatCnt - 1) & 0xff;

        else { eg.state = EG_D; val = 1.0; }

      return slopeValue(val, eg.slope);

// ---------------------------------------------------------------------------------------
// transientGenerator.c: 12 one-shot click/attack samples, plus "snap" (0) and "offset" (1)
// ---------------------------------------------------------------------------------------
const NUM_TRANSIENTS = 12;
const TRANSIENT_LEN = 2205;
const TRANSIENT_END = 2311061504; // 2204 << 20

function makeTransient() { return { phase: 0, pitch: 1, waveform: 0, volume: 1 }; }
// Mobile: waves past the firmware's 14 are the extra int16 clicks in lxr-clicks.js.
const NUM_WAVES = NUM_TRANSIENTS + 2 + EXTRA_CLICKS.length;
function transient_setWaveform(t, w) { t.waveform = w < NUM_WAVES ? w : 0; }
// Extra clicks: same phase field (u32, 20-bit fraction) but each sample has its own length.
function extra_calcBlock(t, buf, size) {
  const d = EXTRA_CLICKS[t.waveform - NUM_TRANSIENTS - 2], end = d.length - 1;
  const inc = t.pitch * 1048576;
  for (let i = 0; i < size; i++) {
    const idx = t.phase / 1048576;
    if (idx < end) {
      const k = idx | 0, fr = idx - k;
      buf[i] = toI16(t.volume * (d[k] + (d[k + 1] - d[k]) * fr));
      t.phase += inc;
    } else buf[i] = 0;
  }
}
function transient_calcBlock(t, buf, size) {
  if (t.waveform >= NUM_TRANSIENTS + 2) { extra_calcBlock(t, buf, size); return; }
  if (t.waveform <= 1 || t.phase >= TRANSIENT_END) { buf.fill(0, 0, size); return; }
  const base = (t.waveform - 2) * TRANSIENT_LEN;
  const inc = f(t.pitch * 1048576);
  for (let i = 0; i < size; i++) {
    if (t.phase < TRANSIENT_END) {
      const idx = t.phase >>> 20;
      buf[i] = toI16(f(f(t.volume * (TRANSIENT_DATA[base + idx] << 8)) * (idx < TRANSIENT_LEN ? 1 : 0)));
      t.phase = toU32(f(f(t.phase) + inc)); // phase += float: the add happens in float
    } else {
      buf[i] = 0;
    }
  }

// distortion.c, 1PoleLp.c, valueShaper.h
// ---------------------------------------------------------------------------------------
const distShape = (shape) => { shape = f(shape - 0.0078125); return f(f(2 * shape) / f(1 - shape)); };

  let x = f(s / F_32767);
  x = f(f(f(1 + shape) * x) / f(1 + f(shape * Math.abs(x))));
  return toI16(f(x * 32767));
}

function makeOnePole() { return { r: f(0.01), b: 0 }; } // initOnePole()
function calcOnePole(flt, input) {
  flt.b = fmaf(flt.r, input - flt.b, flt.b);

function valueShaperF2F(val, shape) {
  const k = f(f(2 * shape) / f(f(1.0001) - shape));

const FILTER_SHAPER = f(-0.9);

// ---------------------------------------------------------------------------------------
// ResonantFilter.c: zero-delay-feedback state variable filter with soft clipping
// ---------------------------------------------------------------------------------------
const FILTER_LP = 1, FILTER_HP = 2, FILTER_BP = 3, FILTER_UNITY_BP = 4, FILTER_NOTCH = 5,
  FILTER_PEAK = 6, FILTER_NAIVE_2_POLE = 7, FILTER_OFF = 8;
const FILTER_TYPE_NAMES = ['LP', 'HP', 'BP', 'Unity BP', 'Notch', 'Peak', 'LP2', 'Off'];

function makeFilter() { return { f: 0, g: 0, q: 0, s1: 0, s2: 0, a: 0, b: 0, drive: 0 }; }

function fastTanh(v) {
  if (v < f(-1.95)) return -1;
  if (v > f(1.95)) return 1;
  return f(f(f(4.15) * v) / f(f(4.29) + f(v * v)));
}
function fastTan(x) {
  x = f(x);

  const B = f(3 * f(-5 + f(2 * x2)));
  return f(A / B);
}

  const a = f(x * x);
  return f(f(f(f(a + 105) * a) + 945) / f(f(f(f(15 * a) + 420) * a) + 945));
}
const softClipTwo = (x) => f(x * tanhXdX(f(0.5 * x)));

function SVF_init(flt) {
  flt.s1 = 0; flt.s2 = 0; flt.a = flt.b = 0;
  flt.f = f(0.20); flt.q = f(0.9); flt.drive = f(0.315);

}
function SVF_reset(flt) { flt.s1 = 0; flt.s2 = 0; flt.a = flt.b = 0; }

function SVF_calcBlockZDF(flt, type, buf, size) {
  const g = flt.g;
  const R = flt.f >= f(0.4499) ? 1 : flt.q; // high cutoff + resonance would go unstable
  const gg = f(g * g);
  if (type === FILTER_OFF) return;
  if (type === FILTER_NAIVE_2_POLE) {
    const f2 = f(flt.f * f(2.21));
    for (let i = 0; i < size; i++) {
      const x = softClipTwo(f(f(buf[i] / F_32767) * flt.drive));
      const q = f(f(1 - flt.q) * 1.4 + f(1 - flt.q) / (1.0 - f2));
      flt.a = f(flt.a + f(f2 * f(f(x - flt.a) + f(q * f(flt.a - flt.b)))));
      if (flt.a > 1) flt.a = 1; else if (flt.a < -1) flt.a = -1;
      flt.b = f(flt.b + f(f2 * f(flt.a - flt.b)));
      if (flt.b > 1) flt.b = 1; else if (flt.b < -1) flt.b = -1;
      buf[i] = ssat16(toI32(f(flt.b * 32767)));
    }
    return;
  }
  if (flt.s1 !== flt.s1) flt.s1 = 0; // removeMaliciousSample()
  if (flt.s2 !== flt.s2) flt.s2 = 0;
  for (let i = 0; i < size; i++) {
    const x = softClipTwo(f(f(buf[i] / F_32767) * flt.drive));
    // t0 = t1 = 1 (nonlinear integrators are compiled out)
    const g0 = f(1 / f(1 + f(f(g * 2) * R)));
    const s1 = flt.s1, s2 = flt.s2;
    const f1 = f(gg * g0);
    const y1 = f(f(f(f(f1 * x) + s2) + f(f(g * g0) * s1)) / f(f1 + 1));
    const xx = f(x - y1);
    const y0 = f(f(softClipTwo(s1) + f(g * xx)) * g0);
    flt.s1 = f(softClipTwo(s1) + f(f(2 * g) * f(xx - f(f(2 * R) * y0))));
    flt.s2 = f(s2 + f(f(2 * g) * y0));

    switch (type) {
      case FILTER_LP: out = f(fastTanh(y1) * 32767); break;
      case FILTER_HP: { const ugb = f(f(2 * R) * y0); out = f(f(f(x - ugb) - y1) * 32767); break; }
      case FILTER_BP: out = f(y0 * 32767); break;

      case FILTER_NOTCH: out = f(f(x - f(f(2 * R) * y0)) * 32767); break;
      case FILTER_PEAK: { const ugb = f(f(2 * R) * y0); const h = f(f(x - ugb) - y1); out = f(f(y1 - h) * 32767); break; }
      default: return; // unknown type: stop processing (leaves the rest of the block as is)
    }
    buf[i] = ssat16(toI32(out));
  }
}

const LFO_WAVE_NAMES = ['Sine', 'Tri', 'Saw up', 'Saw down', 'Rec', 'Noise', 'Exp up', 'Exp down'];

function makeLfo() {

  const overflow = old > lfo.phase;

class FxBus {
  constructor() {
    this.dryWet = 0;
    this.audioRouting = 0;
    this.fxType = FX_OFF;
    this.parameter = new Float32Array(4);
    this.distortion = makeDistortion();
    this.ringmod = makeRingmod();
    this.compressor = makeCompressor();
    this.delay = makeDelay();
    this.reverb = makeReverb();
    this.buffer = new Float32Array(SYNC_BUFFER_SIZE + 1); // __fp16 FX_BUFFER, kept as float values
    this.forceWet = false; // not in the firmware: the bus output is all effect (a send effect)
    this.input = new Int16Array(BLOCK * 2);
  }
  setParameter(idx, value) { this.parameter[idx] = value; this.updateParameter(); }
  /**
   * Not in the firmware: set the delay time directly in samples (tempo sync), or null to go
   * back to the TIME/RANGE knobs. Up to SYNC_BUFFER_SIZE (ping-pong: half of it).
   */
  setDelaySync(samples) {
    const d = this.delay;
    if (samples === null) { if (d.sync === null) return; d.sync = null; d.mask = FX_BUFFER_SIZE; }
    else {
      d.mask = SYNC_BUFFER_SIZE;
      const max = (d.type === DELAY_NORMAL ? d.mask : d.mask >> 1) - 2;
      samples = Math.max(1, Math.min(max, samples));
      if (d.sync !== null && Math.abs(samples - d.sync) < 0.5) return;
      d.sync = samples;
    }
    delaySetDelayTime(d, d.delayTime);
  }

    const p = this.parameter;
    switch (this.fxType) {
      case FX_DISTORTION:
        Object.assign(this.distortion, { drive: p[0], p1: p[1], p2: p[2], p3: p[3] });
        break;
      case FX_RING:
        this.ringmod.osc.freq = f(p[0] * 880);
        osc_setFreq(this.ringmod.osc);
        break;
      case FX_COMPRESSOR: {
        const c = this.compressor;
        c.attack = compExpCoef(f(f(0.03) + f(p[0] * 100)));
        c.release = compExpCoef(f(25 + f(p[1] * 175)));
        c.tresh = f(-96 + f(p[2] * 96));
        c.markupGain = f(1 + f(p[3] * 2));
        break;
      }
      case FX_DELAY: {
        const d = this.delay;
        d.range = p[1]; delaySetDelayTime(d, d.delayTime);
        delaySetDelayTime(d, p[0]);
        setOnePoleCoef(d.tone, f(p[2] * p[2]));
        setOnePoleCoef(d.tone2, f(p[2] * p[2]));
        d.feedback = p[3];
        break;
      }
      case FX_REVERB: reverbSetParameters(this.reverb, p); break;
      default: break;
    }
  }
  /** FxBus_process: this.input (stereo, interleaved) -> added into out (stereo, interleaved) */
  process(out, size, rng) {
    const fx = this.input, dw = this.forceWet ? 1 : this.dryWet;
    switch (this.fxType) {
      case FX_DISTORTION: distortionProcess(this.distortion, fx, out, size, dw); break;
      case FX_RING: ringmodProcess(this.ringmod, fx, out, size, dw, rng); break;
      case FX_COMPRESSOR: compressorProcess(this.compressor, fx, out, size, dw); break;
      case FX_DELAY:
        if (this.delay.type === DELAY_NORMAL) delayProcess(this.delay, this.buffer, fx, out, size, dw);
        else delayProcessPingPong(this.delay, this.buffer, fx, out, size, dw);
        break;
      case FX_REVERB: reverbProcess(this.reverb, fx, out, size, dw); break;
      default: // FX_OFF
        for (let i = 0; i < size * 2; i++) out[i] = qadd16(out[i], fx[i]);
        break;
    }
  }
}

class LxrEngine {

   * either way) or 'ring' (ring modulation of the voice's output). Sources are read one
   * block (64 samples) late, so a voice can also modulate itself. Pass null to switch it off.

    const v = this.snare, osc = this._buf2, trans = this._buf3, size = BLOCK;
    calcNoiseBlock(v.noiseOsc, buf, size, f(0.9), this.rng);
    SVF_calcBlockZDF(v.filter, v.filterType, buf, size);
    calcNextOscSampleBlock(v.osc, osc, size, f(1 - v.mix), v.pwm, this.rng);
    transient_calcBlock(v.transGen, trans, size);
    v.combinedVolume = v.volumeMod ? f(f(v.vol * v.velo) * v.egValueOscVol) : f(v.vol * v.egValueOscVol);
    for (let j = 0; j < size; j++) {
      let tmp = fmaf(buf[j], v.mix, osc[j]);
      tmp = f(tmp + trans[j]);
      buf[j] = toI16(f(f(v.combinedVolume * tmp) * calcOnePole(v.faderFilter, this.faderVolume[3])));
    }
    for (let j = 0; j < size; j++) buf[j] = distortSample(buf[j], v.distortionShape);
  }
  _metalSync(v, fmGain, faderIdx, buf) {
    const mod = this._buf2, mod2 = this._buf3, size = BLOCK;
    calcNextOscSampleBlock(v.modOsc, mod, size, v.fmModAmount1, v.pwm, this.rng);
    calcNextOscSampleBlock(v.modOsc2, mod2, size, v.fmModAmount2, v.pwm, this.rng);
    for (let i = 0; i < size; i++) mod[i] = qadd16(mod[i], mod2[i]);
    calcNextOscSampleFmBlock(v.osc, mod, buf, size, fmGain, v.pwm, this.rng);
    SVF_calcBlockZDF(v.filter, v.filterType, buf, size);
    transient_calcBlock(v.transGen, mod, size);
    v.combinedVolume = v.volumeMod ? f(f(v.vol * v.velo) * v.egValueOscVol) : f(v.vol * v.egValueOscVol);
    for (let i = 0; i < size; i++) buf[i] = qadd16(buf[i], mod[i]);
    for (let j = 0; j < size; j++) {
      buf[j] = toI16(f(buf[j] * f(v.combinedVolume * calcOnePole(v.faderFilter, this.faderVolume[faderIdx]))));
    }
    for (let j = 0; j < size; j++) buf[j] = distortSample(buf[j], v.distortionShape);
  }
  _decimate(n, buf) {
    const inc = f(this.decimationRate[n] * this.decimationRate[6]);
    for (let i = 0; i < BLOCK; i++) {
      this.decimationCnt[n] = f(this.decimationCnt[n] + inc);
      if (this.decimationCnt[n] >= 1) {
        this.decimationCnt[n] = f(this.decimationCnt[n] - 1);
        this.voiceSamples[n] = buf[i];
      }
      buf[i] = this.voiceSamples[n];
    }
  }

  /**
   * mixer_calcNextSampleBlock(), up to the per-voice outputs: renders the next 64 samples
   * of each voice into this.out[0..5] (int16, mono, before panning and the FX bus)
   */
  renderBlock() {
    this._resetTargets();
    for (const vm of this.velocityModulators) this._modUpdate(vm, vm.lastVal);
    for (const lfo of this.lfos) this._modUpdate(lfo.modTarget, lfo_calc(lfo, this.rng));
    SVF_recalcFreq(this.drums[0].filter);
    SVF_recalcFreq(this.drums[1].filter);
    SVF_recalcFreq(this.drums[2].filter);
    SVF_recalcFreq(this.snare.filter);
    SVF_recalcFreq(this.cymbal.filter);
    SVF_recalcFreq(this.hat.filter);
    if (this.xmod) this._xmodBefore();
    for (const d of this.drums) this._drumAsync(d);
    this._snareAsync(this.snare);
    this._metalAsync(this.cymbal);
    this._metalAsync(this.hat);
    const o = this.out;
    for (let n = 0; n < 3; n++) { this._drumSync(n, o[n]); this._decimate(n, o[n]); }
    this._snareSync(o[3]); this._decimate(3, o[3]);
    this._metalSync(this.cymbal, 1, 4, o[4]); this._decimate(4, o[4]);
    this._metalSync(this.hat, f(0.5), 5, o[5]); this._decimate(5, o[5]);
    if (this.xmod) this._xmodAfter();
    return o;
  }

  /**
   * The FX bus part of mixer_calcNextSampleBlock(): voices whose AUDIO_OUT is the FX bus
   * are panned into one stereo int16 buffer and run through the selected effect.
   * Returns this.fxOut: the bus's stereo output (interleaved int16) for the last renderBlock().
   * gains[n], if given, scales voice n first (mute, accent; not in the firmware).
   */
  renderFx(gains = null, width = null) {
    const fx = this.fx, inp = fx.input, out = this.fxOut;
    inp.fill(0); out.fill(0);
    const pans = [this.drums[0], this.drums[1], this.drums[2], this.snare, this.cymbal, this.hat];
    let any = false;
    for (let n = 0; n < 6; n++) {
      if (this.audioRouting[n] !== MIXER_ROUTING_FX_BUS) continue;
      any = true;
      const v = pans[n], o = this.out[n], g = gains ? gains[n] : 1;
      for (let i = 0; i < BLOCK; i++) {
        const s = g === 1 ? o[i] : toI16(f(o[i] * g));
        inp[2 * i] = qadd16(toI16(f(s * v.triggeredPanL)), inp[2 * i]);
        inp[2 * i + 1] = qadd16(toI16(f(s * v.triggeredPanR)), inp[2 * i + 1]);
      }
    }
    // Not in the firmware (width 0..2, 1 or null = as the firmware): the delay's stereo width.
    // Ping-pong: below 1 the side of its input is narrowed (0 = mono, no bounce); above 1 the mid is
    // pushed left, since the firmware's ping-pong only bounces what reaches it off-centre (2 = a centred
    // sound goes in on one side only and bounces fully). Normal delay: the side of its output is scaled.
    const delay = width !== null && width !== 1 && fx.fxType === FX_DELAY, pp = delay && fx.delay.type !== DELAY_NORMAL;
    if (pp) for (let i = 0; i < BLOCK; i++) {
      const l = inp[2 * i], r = inp[2 * i + 1], mid = (l + r) / 2, side = (l - r) / 2;
      const nl = width <= 1 ? mid + side * width : l + mid * (width - 1), nr = width <= 1 ? mid - side * width : r - mid * (width - 1);
      inp[2 * i] = ssat16(Math.round(nl)); inp[2 * i + 1] = ssat16(Math.round(nr));
    }
    // FxBus_process runs every block, routed voices or not (delay tails, compressor envelope)
    fx.process(out, BLOCK, this.rng);
    if (delay && !pp) for (let i = 0; i < BLOCK; i++) {
      const mid = (out[2 * i] + out[2 * i + 1]) / 2, side = (out[2 * i] - out[2 * i + 1]) / 2 * width;
      out[2 * i] = ssat16(Math.round(mid + side)); out[2 * i + 1] = ssat16(Math.round(mid - side));
    }
    return out;
  }

  /** stereo mix of this.out using each voice's pan from its last trigger, as floats -1..1 */
  mixStereo(left, right, offset = 0) {
    const pans = [this.drums[0], this.drums[1], this.drums[2], this.snare, this.cymbal, this.hat];
    for (let i = 0; i < BLOCK; i++) {
      let l = 0, r = 0;
      for (let n = 0; n < 6; n++) {
        const s = this.out[n][i];
        l += s * pans[n].triggeredPanL;
        r += s * pans[n].triggeredPanR;
      }
      left[offset + i] = l / 32768;
      right[offset + i] = r / 32768;
    }
  }

  // ---------------------------------------------------------------------------------------
  // midiParser_ccHandler(): parameter changes, from edits (isFloatModulator false, data2 =
  // 0..127) and from modulation (isFloatModulator true, v = 0..1)
  // ---------------------------------------------------------------------------------------
  ccHandler(isCC2, num, data2, isFloatModulator, v) {
    let itg, flt;
    if (isFloatModulator) { itg = toU8(f(v * 127)); flt = f(v); }
    else { itg = data2 & 0xff; flt = f(itg / 127); }
    const [d0, d1, d2] = this.drums;
    const drums = this.drums, sn = this.snare, cy = this.cymbal, hh = this.hat;
    const wave = (count) => {
      if (!isFloatModulator) return itg;
      const w = toU8(f(count * flt));
      return w >= count ? count - 1 : w;
    };
    const pitchModAmount = (x) => { const val = f(x / 127); return f(f(val * val) * 32); };
    const filterValue = () => valueShaperF2F(flt, FILTER_SHAPER);
    const transPitch = () => f(1 + f(f(itg / f(33.9)) - f(0.75)));

    if (!isCC2) {
      switch (num) {
        case CC.NRPN_DATA_ENTRY_COARSE:
          // midiParser_nrpnHandler: forwards the value to CC2 number activeNrpnNumber
          this.ccHandler(true, this.activeNrpnNumber & 0xff, itg, false, 0);
          return;
        case CC.NRPN_FINE: this.activeNrpnNumber = (this.activeNrpnNumber & ~0x7f) | (itg & 0x7f); break;
        case CC.NRPN_COARSE: this.activeNrpnNumber = ((this.activeNrpnNumber & 0x7f) | (itg << 7)) & 0xffff; break;
        case CC.VOL_SLOPE1: slopeEg2_setSlope(d0.oscVolEg, itg); break;
        case CC.PITCH_SLOPE1: decayEg_setSlope(d0.oscPitchEg, itg); break;
        case CC.VOL_SLOPE2: slopeEg2_setSlope(d1.oscVolEg, itg); break;
        case CC.PITCH_SLOPE2: decayEg_setSlope(d1.oscPitchEg, itg); break;
        case CC.VOL_SLOPE3: slopeEg2_setSlope(d2.oscVolEg, itg); break;
        case CC.PITCH_SLOPE3: decayEg_setSlope(d2.oscPitchEg, itg); break;
        case CC.PITCH_SLOPE4: decayEg_setSlope(sn.oscPitchEg, itg); break;
        case CC.VOL_SLOPE6: slopeEg2_setSlope(hh.oscVolEg, itg); break;
        case CC.FILTER_FREQ_DRUM1: case CC.FILTER_FREQ_DRUM2: case CC.FILTER_FREQ_DRUM3:
          SVF_directSetFilterValue(drums[num - CC.FILTER_FREQ_DRUM1].filter, filterValue()); break;
        case CC.RESO_DRUM1: case CC.RESO_DRUM2: case CC.RESO_DRUM3:
          SVF_setReso(drums[num - CC.RESO_DRUM1].filter, flt); break;
        case CC.F_OSC1_COARSE: setCoarse(d0.osc, itg); break;
        case CC.F_OSC2_COARSE: setCoarse(d1.osc, itg); break;
        case CC.F_OSC3_COARSE: setCoarse(d2.osc, itg); break;
        case CC.F_OSC4_COARSE: setCoarse(sn.osc, itg); break;
        case CC.F_OSC5_COARSE: setCoarse(cy.osc, itg); break;
        case CC.F_OSC1_FINE: setFine(d0.osc, itg); break;
        case CC.F_OSC2_FINE: setFine(d1.osc, itg); break;
        case CC.F_OSC3_FINE: setFine(d2.osc, itg); break;
        case CC.F_OSC4_FINE: setFine(sn.osc, itg); break;
        case CC.F_OSC5_FINE: setFine(cy.osc, itg); break;
        case CC.F_OSC6_FINE: setFine(hh.osc, itg); break;
        case CC.OSC_WAVE_DRUM1: d0.osc.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.MOD_WAVE_DRUM1: d0.modOsc.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.OSC_WAVE_DRUM2: d1.osc.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.MOD_WAVE_DRUM2: d1.modOsc.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.OSC_WAVE_DRUM3: d2.osc.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.MOD_WAVE_DRUM3: d2.modOsc.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.OSC_WAVE_SNARE: sn.osc.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.OSC1_DIST: d0.distortion.shape = distShape(flt); break;
        case CC.OSC2_DIST: d1.distortion.shape = distShape(flt); break;
        case CC.OSC3_DIST: d2.distortion.shape = distShape(flt); break;
        case CC.VELOA1: d0.oscVolEg.attack = slopeEg2_calcTime(itg, TIME_K_ATTACK); break;
        case CC.VELOD1: d0.oscVolEg.decay = slopeEg2_calcTime(itg, TIME_K_DECAY); break;
        case CC.PITCHD1: d0.oscPitchEg.decay = decayEg_calcTime(itg); break;
        case CC.MODAMNT1: d0.egPitchModAmount = pitchModAmount(itg); break;
        case CC.FMAMNT1: d0.fmModAmount = flt; break;
        case CC.FMDTN1: setCoarse(d0.modOsc, itg); break;
        case CC.VOL1: d0.vol = flt; break;
        case CC.PAN1: d0.pan = itg; break;
        case CC.VELOA2: d1.oscVolEg.attack = slopeEg2_calcTime(itg, TIME_K_ATTACK); break;
        case CC.VELOD2: d1.oscVolEg.decay = slopeEg2_calcTime(itg, TIME_K_DECAY); break;
        case CC.PITCHD2: d1.oscPitchEg.decay = decayEg_calcTime(itg); break;
        case CC.MODAMNT2: d1.egPitchModAmount = pitchModAmount(itg); break;
        case CC.FMAMNT2: d1.fmModAmount = flt; break;
        case CC.FMDTN2: setCoarse(d1.modOsc, itg); break;
        case CC.VOL2: d1.vol = flt; break;
        case CC.PAN2: d1.pan = itg; break;
        case CC.VELOA3: d2.oscVolEg.attack = slopeEg2_calcTime(itg, TIME_K_ATTACK); break;
        case CC.VELOD3: d2.oscVolEg.decay = slopeEg2_calcTime(itg, TIME_K_DECAY); break;
        case CC.PITCHD3: d2.oscPitchEg.decay = decayEg_calcTime(itg); break;
        case CC.MODAMNT3: d2.egPitchModAmount = pitchModAmount(itg); break;
        case CC.FMAMNT3: d2.fmModAmount = flt; break;
        case CC.FMDTN3: setCoarse(d2.modOsc, itg); break;
        case CC.VOL3: d2.vol = flt; break;
        case CC.PAN3: d2.pan = itg; break;
        case CC.VOL4: sn.vol = flt; break;
        case CC.PAN4: sn.pan = itg; break;
        case CC.SNARE_NOISE_F: sn.noiseOsc.freq = f(flt * 22000); break;
        case CC.VELOA4: sn.oscVolEg.attack = slopeEg2_calcTime(itg, TIME_K_ATTACK); break;
        case CC.VELOD4: sn.oscVolEg.decay = slopeEg2_calcTime(itg, TIME_K_DECAY); break;
        case CC.PITCHD4: sn.oscPitchEg.decay = decayEg_calcTime(itg); break;
        case CC.MODAMNT4: sn.egPitchModAmount = pitchModAmount(itg); break;
        case CC.SNARE_FILTER_F: SVF_directSetFilterValue(sn.filter, filterValue()); break;
        case CC.SNARE_RESO: SVF_setReso(sn.filter, flt); break;
        case CC.SNARE_MIX: sn.mix = flt; break;
        case CC.VOL5: cy.vol = flt; break;
        case CC.PAN5: cy.pan = itg; break;
        case CC.VELOA5: cy.oscVolEg.attack = slopeEg2_calcTime(itg, TIME_K_ATTACK); break;
        case CC.VELOD5: cy.oscVolEg.decay = slopeEg2_calcTime(itg, TIME_K_DECAY); break;
        case CC.CYM_WAVE1: cy.osc.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.CYM_WAVE2: cy.modOsc.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.CYM_WAVE3: cy.modOsc2.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.CYM_MOD_OSC_F1: setCoarse(cy.modOsc, itg); break;
        case CC.CYM_MOD_OSC_F2: setCoarse(cy.modOsc2, itg); break;
        case CC.CYM_MOD_OSC_GAIN1: cy.fmModAmount1 = flt; break;
        case CC.CYM_MOD_OSC_GAIN2: cy.fmModAmount2 = flt; break;
        case CC.CYM_FIL_FREQ: SVF_directSetFilterValue(cy.filter, filterValue()); break;
        case CC.CYM_RESO: SVF_setReso(cy.filter, flt); break;
        case CC.CYM_REPEAT: cy.oscVolEg.repeat = itg; break;
        case CC.CYM_SLOPE: slopeEg2_setSlope(cy.oscVolEg, itg); break;
        case CC.WAVE1_HH: hh.osc.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.WAVE2_HH: hh.modOsc.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.WAVE3_HH: hh.modOsc2.waveform = wave(NUM_OSC_WAVEFORMS); break;
        case CC.VELOD6: hh.decayClosed = f(slopeEg2_calcTime(itg, TIME_K_DECAY)); break;
        case CC.VELOD6_OPEN: hh.decayOpen = f(slopeEg2_calcTime(itg, TIME_K_DECAY)); break;
        case CC.HAT_FILTER_F: SVF_directSetFilterValue(hh.filter, filterValue()); break;
        case CC.HAT_RESO: SVF_setReso(hh.filter, flt); break;
        case CC.VOL6: hh.vol = flt; break;
        case CC.PAN6: hh.pan = itg; break;
        case CC.F_OSC6_COARSE: setCoarse(hh.osc, itg); break;
        case CC.MOD_OSC_F1: setCoarse(hh.modOsc, itg); break;
        case CC.MOD_OSC_F2: setCoarse(hh.modOsc2, itg); break;
        case CC.MOD_OSC_GAIN1: hh.fmModAmount1 = flt; break;
        case CC.MOD_OSC_GAIN2: hh.fmModAmount2 = flt; break;
        case CC.VELOA6: hh.oscVolEg.attack = slopeEg2_calcTime(itg, TIME_K_ATTACK); break;
        case CC.REPEAT1: sn.oscVolEg.repeat = itg; break;
        case CC.EG_SNARE1_SLOPE: slopeEg2_setSlope(sn.oscVolEg, itg); break;
        case CC.SNARE_DISTORTION: sn.distortionShape = distShape(flt); break;
        case CC.CYMBAL_DISTORTION: cy.distortionShape = distShape(flt); break;
        case CC.HAT_DISTORTION: hh.distortionShape = distShape(flt); break;
        case CC.FREQ_LFO1: case CC.FREQ_LFO2: case CC.FREQ_LFO3: case CC.FREQ_LFO4: case CC.FREQ_LFO5: case CC.FREQ_LFO6:
          this._lfoSetFreq(this.lfos[num - CC.FREQ_LFO1], flt); break;
        case CC.AMOUNT_LFO1: case CC.AMOUNT_LFO2: case CC.AMOUNT_LFO3: case CC.AMOUNT_LFO4: case CC.AMOUNT_LFO5: case CC.AMOUNT_LFO6:
          this.lfos[num - CC.AMOUNT_LFO1].modTarget.amount = flt; break;
        case CC.VOICE_DECIMATION1: case CC.VOICE_DECIMATION2: case CC.VOICE_DECIMATION3: case CC.VOICE_DECIMATION4:
        case CC.VOICE_DECIMATION5: case CC.VOICE_DECIMATION6: case CC.VOICE_DECIMATION_ALL:
          this.decimationRate[num - CC.VOICE_DECIMATION1] = valueShaperF2F(flt, f(-0.7)); break;
        default: break;
      }
      return;
    }

    switch (num) {
      case CC2.TRANS1_WAVE: case CC2.TRANS2_WAVE: case CC2.TRANS3_WAVE:
        transient_setWaveform(drums[num - CC2.TRANS1_WAVE].transGen, wave(NUM_WAVES)); break;
      case CC2.TRANS4_WAVE: transient_setWaveform(sn.transGen, wave(NUM_WAVES)); break;
      case CC2.TRANS5_WAVE: transient_setWaveform(cy.transGen, wave(NUM_WAVES)); break;
      case CC2.TRANS6_WAVE: transient_setWaveform(hh.transGen, wave(NUM_WAVES)); break;
      case CC2.TRANS1_VOL: case CC2.TRANS2_VOL: case CC2.TRANS3_VOL:
        drums[num - CC2.TRANS1_VOL].transGen.volume = flt; break;
      case CC2.TRANS4_VOL: sn.transGen.volume = flt; break;
      case CC2.TRANS5_VOL: cy.transGen.volume = flt; break;
      case CC2.TRANS6_VOL: hh.transGen.volume = flt; break;
      case CC2.TRANS1_FREQ: case CC2.TRANS2_FREQ: case CC2.TRANS3_FREQ:
        drums[num - CC2.TRANS1_FREQ].transGen.pitch = transPitch(); break;
      case CC2.TRANS4_FREQ: sn.transGen.pitch = transPitch(); break;
      case CC2.TRANS5_FREQ: cy.transGen.pitch = transPitch(); break;
      case CC2.TRANS6_FREQ: hh.transGen.pitch = transPitch(); break;
      case CC2.FILTER_TYPE_1: case CC2.FILTER_TYPE_2: case CC2.FILTER_TYPE_3:
      case CC2.FILTER_TYPE_4: case CC2.FILTER_TYPE_5: case CC2.FILTER_TYPE_6: {
        let type;
        if (isFloatModulator) {
          type = toU8(f(f(FILTER_NAIVE_2_POLE * flt) + 1));
          type = type >= FILTER_OFF ? FILTER_OFF - 1 : type;
        } else {
          type = (itg + 1) & 0xff; // +1: type 0 would be silence
        }
        [d0, d1, d2, sn, cy, hh][num - CC2.FILTER_TYPE_1].filterType = type;
        break;
      }
      case CC2.FILTER_DRIVE_1: case CC2.FILTER_DRIVE_2: case CC2.FILTER_DRIVE_3:
      case CC2.FILTER_DRIVE_4: case CC2.FILTER_DRIVE_5: case CC2.FILTER_DRIVE_6:
        SVF_setDrive([d0, d1, d2, sn, cy, hh][num - CC2.FILTER_DRIVE_1].filter, flt); break;
      case CC2.MIX_MOD_1: case CC2.MIX_MOD_2: case CC2.MIX_MOD_3:
        drums[num - CC2.MIX_MOD_1].mixOscs = itg !== 0 ? 1 : 0; break;
      case CC2.VOLUME_MOD_ON_OFF1: case CC2.VOLUME_MOD_ON_OFF2: case CC2.VOLUME_MOD_ON_OFF3:
      case CC2.VOLUME_MOD_ON_OFF4: case CC2.VOLUME_MOD_ON_OFF5: case CC2.VOLUME_MOD_ON_OFF6:
        [d0, d1, d2, sn, cy, hh][num - CC2.VOLUME_MOD_ON_OFF1].volumeMod = itg !== 0 ? 1 : 0; break;
      case CC2.VELO_MOD_AMT_1: case CC2.VELO_MOD_AMT_2: case CC2.VELO_MOD_AMT_3:
      case CC2.VELO_MOD_AMT_4: case CC2.VELO_MOD_AMT_5: case CC2.VELO_MOD_AMT_6:
        this.velocityModulators[num - CC2.VELO_MOD_AMT_1].amount = flt; break;
      case CC2.WAVE_LFO1: case CC2.WAVE_LFO2: case CC2.WAVE_LFO3:
      case CC2.WAVE_LFO4: case CC2.WAVE_LFO5: case CC2.WAVE_LFO6:
        this.lfos[num - CC2.WAVE_LFO1].waveform = wave(NUM_LFO_WAVEFORMS); break;
      case CC2.RETRIGGER_LFO1: case CC2.RETRIGGER_LFO2: case CC2.RETRIGGER_LFO3:
      case CC2.RETRIGGER_LFO4: case CC2.RETRIGGER_LFO5: case CC2.RETRIGGER_LFO6:
        this.lfos[num - CC2.RETRIGGER_LFO1].retrigger = isFloatModulator ? toU8(f(7 * flt)) : itg; break;
      case CC2.SYNC_LFO1: case CC2.SYNC_LFO2: case CC2.SYNC_LFO3:
      case CC2.SYNC_LFO4: case CC2.SYNC_LFO5: case CC2.SYNC_LFO6: {
        const lfo = this.lfos[num - CC2.SYNC_LFO1];
        lfo.sync = itg;
        lfo.phaseInc = lfo_calcPhaseInc(lfo.freq, lfo.sync, this.bpm);
        break;

  for (const f of mFaders) if (f.seq && f.seq.on && n % f.seq.step === 0) fsStep(f, n / f.seq.step, stepMs * f.seq.step);
});

// ---- presets: everything (the sound, perf macros, notes, tempo, effects, master and the fader sequencers) under a
// two-word name, kept in this browser under elixir-synth's own key. Save new, save over the loaded one, load, delete,
// import and export. While playing, a preset waits for the next bar: until it's heard, the one playing stays marked
// and the new one's row flashes ----
const SAVE_KEY = 'elixir-synth-presets', BPM_KEY = 'elixir-synth-presetbpm';
const fromData = (p, extra) => ({ ...structuredClone(p), ...extra });
const presetList = [{ name: 'Init', ...snapshot(), builtin: true },
  ...BUILTIN_PRESETS.filter((p) => p && p.v === PRESET_V && p.kit).map((p) => fromData(p, { builtin: true }))];
const presetData = (k) => { const { builtin, saved, ...p } = k; return structuredClone(p); };
try { for (const p of JSON.parse(localStorage.getItem(SAVE_KEY)) || []) if (p && p.v === PRESET_V && p.kit) presetList.push(fromData(p, { saved: true })); } catch (e) {}
function storePresets() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(presetList.filter((k) => k.saved).map(presetData))); } catch (e) {} }
let pCur = presetList[0], pPending = null, pShown = null;
try { $('m-pbpm').checked = localStorage.getItem(BPM_KEY) !== '0'; } catch (e) {}
$('m-pbpm').addEventListener('change', () => { try { localStorage.setItem(BPM_KEY, $('m-pbpm').checked ? '1' : '0'); } catch (e) {} });
// a new name: two made-up words
const SYL = ['ka', 'zu', 'mo', 'ree', 'vax', 'lo', 'quin', 'tor', 'ba', 'shi', 'nek', 'ul', 'dra', 'po', 'ix', 'fen', 'yo', 'gar', 'mi', 'sol'];
const word = () => { const w = Array.from({ length: rIn(2, 3) }, () => pick(SYL)).join(''); return w[0].toUpperCase() + w.slice(1); };
function newName() { let n; do n = `${word()} ${word()}`; while (presetList.some((k) => k.name === n)); return n; }
function pLoad(k) {
  startAudio();
  const shown = pPending ? pShown : pCur;
  if (playing) barSync = true;
  try { useSnapshot(k, !$('m-pbpm').checked); } finally { barSync = false; }
  pShown = shown; pCur = k; pPending = playing ? k : null;
  mUndoSnap = null; mUndoDraw();
  pDraw();
}
eventHandlers.push((ev) => {
  if (ev.type !== 'step' || ev.step !== 0 || !pPending) return;
  const p = pPending; setTimeout(() => { if (pPending === p) { pPending = null; pDraw(); } }, ctx && ctx.outputLatency ? ctx.outputLatency * 1000 : 0);
});
stopHooks.push(() => { if (pPending) { pPending = null; pDraw(); } });
function pDraw() {
  const over = !pPending && pCur.saved ? pCur : null;
  $('m-pover').disabled = !over; $('m-pover').textContent = over ? `save over ${over.name}` : 'save over';
  const list = $('m-plist'), cur = pPending ? pShown : pCur;
  list.innerHTML = '';
  const group = (t) => { const li = document.createElement('li'); li.className = 'm-pgroup'; li.textContent = t; list.append(li); };
  const row = (k) => {
    const li = document.createElement('li'); li.classList.toggle('cur', k === cur); li.classList.toggle('pending', k === pPending);
    li.innerHTML = '<button class="m-pload" type="button"><b></b><small></small></button>';
    li.querySelector('b').textContent = k.name; li.querySelector('small').textContent = `${k.tempo} bpm`;
    li.querySelector('.m-pload').addEventListener('click', () => pLoad(k));
    if (k.saved) {
      const d = document.createElement('button'); d.className = 'm-pdel'; d.type = 'button'; d.textContent = '✕';
      d.setAttribute('aria-label', `Delete ${k.name}`);
      d.addEventListener('click', () => {
        if (!confirm(`Delete ${k.name}?`)) return;
        presetList.splice(presetList.indexOf(k), 1); storePresets();
        if (pCur === k) pCur = presetList[0];
        pDraw();
      });
      li.append(d);
    } else { const gap = document.createElement('span'); gap.className = 'm-pdel'; li.append(gap); }
    list.append(li);
  };
  const mine = presetList.filter((k) => k.saved);
  if (mine.length) { group('mine'); mine.slice().reverse().forEach(row); } else group('mine: none yet, save makes one');
  group('built in');
  presetList.filter((k) => k.builtin).forEach(row);
}
pageHooks.push((t) => { if (t === 'presets') pDraw(); });
$('m-psave').addEventListener('click', () => {
  const k = { name: newName(), ...snapshot(), saved: true };
  presetList.push(k); storePresets(); pCur = k; pPending = null;
  $('m-pnote').textContent = `Saved as ${k.name}.`;
  pDraw();
});
$('m-pover').addEventListener('click', () => {
  const k = pCur;
  if (!k.saved || !confirm(`Save the current sound over ${k.name}?`)) return;
  Object.assign(k, snapshot()); storePresets();
  $('m-pnote').textContent = `Saved over ${k.name}.`;
  pDraw();
});
// files: { elixirSynth: 1, presets: [...] }; a name already saved here is skipped
$('m-pimport').addEventListener('change', async (e) => {
  let n = 0, bad = 0;
  for (const f of e.target.files) {
    try {
      for (const p of JSON.parse(await f.text()).presets || []) {
        if (!p || p.v !== PRESET_V || !p.kit || !p.name) { bad++; continue; }
        if (presetList.some((k) => k.saved && k.name === p.name)) continue;
        presetList.push(fromData(p, { saved: true })); n++;
      }
    } catch (err) { bad++; }
  }
  e.target.value = '';
  if (n) storePresets();
  $('m-pnote').textContent = (n ? `Imported ${n}.` : 'Nothing new to import.') + (bad ? ` ${bad} skipped: not elixir-synth presets.` : '');
  pDraw();
});
$('m-pexport').addEventListener('click', async () => {
  const list = presetList.filter((k) => k.saved).map(presetData);
  if (!list.length) { $('m-pnote').textContent = 'No presets of yours to export yet.'; return; }
  const blob = new Blob([JSON.stringify({ elixirSynth: 1, presets: list }, null, 1)], { type: 'application/json' });
  if (await mOffer({ blob, name: 'elixir-synth-presets.json' }, 'application/json')) $('m-pnote').textContent = `Exported ${list.length} preset${list.length > 1 ? 's' : ''}.`;
});
pDraw();

// ---- record: one press starts a take at once (and starts playing), the next stops it and downloads it as a WAV
// (44.1 kHz, 16-bit, the finished mix) ----
let recState = 'off', recChunks = [], recT0 = 0, recTimer = 0, takeNo = 0;
function recUi() {
  const on = recState === 'on';
  $('m-rec').setAttribute('aria-pressed', on); $('m-rec').classList.toggle('on', on);
  clearInterval(recTimer);
  if (on) {
    const tick = () => { const t = Math.max(0, (performance.now() - recT0) / 1000); $('m-rec-t').textContent = `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`; };
    tick(); recTimer = setInterval(tick, 250);
  } else $('m-rec-t').textContent = recState === 'saving' ? 'saving' : 'rec';
}
const recSend = (m) => { if (node) node.port.postMessage(m); else if (fallback) fallback.msg(m); };
$('m-rec').addEventListener('click', async () => {
  if (recState === 'off') {
    await startAudio();
    recChunks = []; recState = 'on'; recT0 = performance.now();
    recSend({ type: 'rec' });
    if (!playing) setPlaying(true);
  } else if (recState === 'on') { recState = 'saving'; recSend({ type: 'recStop' }); }
  recUi();
});
eventHandlers.push((ev) => {
  if (ev.type === 'recData') recChunks.push(ev);
  else if (ev.type === 'rec' && ev.state === 'done') finishTake(ev);
});
async function finishTake(ev) {
  const n = recChunks.reduce((a, c) => a + c.L.length, 0), rate = 44100;
  if (n) {
    const src = new AudioBuffer({ numberOfChannels: 2, length: n, sampleRate: LXR.REAL_FS });
    for (const [ch, key] of [[0, 'L'], [1, 'R']]) { const d = src.getChannelData(ch); let o = 0; for (const c of recChunks) { d.set(c[key], o); o += c[key].length; } }
    const frames = Math.round(n * rate / LXR.REAL_FS), off = new OfflineAudioContext(2, frames, rate);
    const bs = off.createBufferSource(); bs.buffer = src; bs.connect(off.destination); bs.start();
    const out = await off.startRendering();
    const name = `elixir-synth ${(pCur && pCur.name) || 'take'} ${ev.bpm}bpm ${++takeNo}.wav`.replace(/[^\w' .-]/g, '');
    mDownload({ blob: wavBlob(out.getChannelData(0), out.getChannelData(1), rate), name });
  }
  recChunks = []; recState = 'off'; recUi();
}
function wavBlob(L, R, rate) {
  const n = L.length, buf = new ArrayBuffer(44 + n * 4), v = new DataView(buf);
  const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 4, true);
  v.setUint16(32, 4, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 4, true);
  let o = 44;
  // triangular dither, clipped at full scale
  for (let i = 0; i < n; i++) for (const x of [L[i], R[i]]) { v.setInt16(o, Math.max(-32768, Math.min(32767, Math.round(x * 32767 + rnd() - rnd()))), true); o += 2; }
  return new Blob([buf], { type: 'audio/wav' });
}
function mDownload(t) {
  const a = document.createElement('a'), url = URL.createObjectURL(t.blob);
  a.href = url; a.download = t.name; a.style.display = 'none';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
// phones get the share sheet (save to files, apps); elsewhere it downloads (false if the share sheet was cancelled)
async function mOffer(t, type) {
  const file = new File([t.blob], t.name, { type });
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: t.name }); return true; } catch (e) { if (e.name === 'AbortError') return false; }
  }
  mDownload(t);
  return true;
}
recUi();

// ---- installable: a service worker keeps the app for offline use (sw.js: the page comes from the network first, so a
// new version arrives as soon as there's a connection), and the presets page offers to install it where the browser
// allows (Chrome on Android also has Install app in its menu) ----
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
let mInstallEv = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); mInstallEv = e; $('m-install').hidden = false; });
addEventListener('appinstalled', () => { mInstallEv = null; $('m-install').hidden = true; });
$('m-install').addEventListener('click', async () => {
  if (!mInstallEv) return;
  mInstallEv.prompt(); await mInstallEv.userChoice.catch(() => {});
  mInstallEv = null; $('m-install').hidden = true;
});
// start: everything drawn, the first page shown
mUndoDraw(); drawAll(); mGo(0); requestAnimationFrame(mDepth);
</script>
